<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>주차 현황</title>
    <style>
      :root {
        --font-base: 28px;
        --bg: #f0f2f5;
        --surface: #ffffff;
        --border: #e4e7ec;
        --text-main: #0f172a;
        --text-sub: #64748b;
        --accent: #1d4ed8;
        --accent-light: #eff6ff;
        --accent-mid: #bfdbfe;
        --radius: 20px;
        --radius-sm: 14px;
        --shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        font-size: var(--font-base);
      }

      body {
        font-family:
          -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕",
          sans-serif;
        background: var(--bg);
        color: var(--text-main);
        min-height: 100vh;
      }

      /* 헤더 */
      .header {
        background: var(--accent);
        padding: 20px 20px 24px;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .header-badge {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 4px 12px;
        border-radius: 100px;
        letter-spacing: 0.5px;
      }
      .header-updated {
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.65);
      }
      .header-title {
        font-size: 1.5rem;
        font-weight: 800;
        color: #fff;
        letter-spacing: -0.5px;
      }
      .header-subtitle {
        font-size: 0.8125rem;
        color: rgba(255, 255, 255, 0.65);
        margin-top: 2px;
      }

      /* 공지사항 하단 시트 */
      .notice-overlay {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(0, 0, 0, 0);
        pointer-events: none;
        transition: background 0.28s ease-out;
      }
      .notice-overlay.show {
        background: rgba(0, 0, 0, 0.45);
        pointer-events: auto;
      }
      .notice-sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 201;
        display: flex;
        flex-direction: column;
        background: #fff;
        border-top-left-radius: 24px;
        border-top-right-radius: 24px;
        box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.18);
        max-height: 80vh;
        transform: translateY(100%);
        transition: transform 0.28s ease-out;
        padding-bottom: env(safe-area-inset-bottom);
        visibility: hidden;
      }
      .notice-sheet.show {
        transform: translateY(0);
        visibility: visible;
      }
      .notice-sheet-handle {
        width: 44px;
        height: 5px;
        background: #cbd5e1;
        border-radius: 999px;
        margin: 10px auto 4px;
        flex-shrink: 0;
      }
      .notice-sheet-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 20px 12px;
        flex-shrink: 0;
      }
      .notice-sheet-title {
        font-size: 1.0625rem;
        font-weight: 800;
        color: var(--text-main);
      }
      .notice-sheet-close {
        width: 40px;
        height: 40px;
        border: none;
        background: transparent;
        font-size: 1.5rem;
        line-height: 1;
        color: var(--text-sub);
        cursor: pointer;
        border-radius: 12px;
        font-family: inherit;
      }
      .notice-sheet-close:active {
        background: var(--bg);
      }
      .notice-sheet-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .notice-item {
        padding: 16px 16px 18px;
        background: var(--accent-light);
        border-radius: var(--radius-sm);
        border-left: 4px solid var(--accent);
      }
      .notice-item-title {
        font-size: 1rem;
        font-weight: 800;
        color: var(--text-main);
        margin-bottom: 6px;
        letter-spacing: -0.2px;
      }
      .notice-item-body {
        font-size: 0.9375rem;
        color: var(--text-main);
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .notice-sheet-footer {
        padding: 12px 20px 20px;
        flex-shrink: 0;
        border-top: 1px solid var(--border);
      }
      .notice-sheet-confirm {
        width: 100%;
        padding: 20px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 1.0625rem;
        font-weight: 800;
        font-family: inherit;
        cursor: pointer;
        letter-spacing: -0.2px;
      }
      .notice-sheet-confirm:active {
        transform: scale(0.98);
      }

      /* 카드 그리드 */
      .grid {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px;
      }

      .car-card {
        background: var(--surface);
        border-radius: var(--radius);
        padding: 28px 24px;
        box-shadow: var(--shadow);
        border: 2px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* 차량번호 */
      .car-number {
        font-size: 2.3rem;
        font-weight: 800;
        color: var(--text-main);
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .car-number .car-icon {
        font-size: 1.375rem;
      }

      /* 주차위치 강조 */
      .parking-slot {
        background: var(--accent-light);
        border: 2px solid var(--accent-mid);
        border-radius: var(--radius-sm);
        padding: 28px 10px;
        text-align: center;
      }
      .parking-slot .slot-label {
        font-size: 0.875rem;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .parking-slot .slot-value {
        font-size: 4rem;
        font-weight: 900;
        color: var(--accent);
        letter-spacing: -2px;
        line-height: 1;
      }
      .parking-slot.unknown {
        background: #f8fafc;
        border-color: var(--border);
      }
      .parking-slot.unknown .slot-label {
        color: var(--text-sub);
      }
      .parking-slot.unknown .slot-value {
        font-size: 2rem;
        color: var(--text-sub);
        font-weight: 600;
      }

      /* 운전자 / 시간 정보 */
      .meta-row {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .meta-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 1rem;
        color: var(--text-sub);
        font-weight: 500;
      }
      .meta-item .meta-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
      }
      .meta-item .meta-value {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 운행일지 기록 버튼 */
      .record-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 18px 20px;
        background: var(--accent-light);
        border: 2px solid var(--accent-mid);
        border-radius: var(--radius-sm);
        color: var(--accent);
        font-size: 1rem;
        font-weight: 800;
        font-family: inherit;
        letter-spacing: -0.2px;
        cursor: pointer;
        text-decoration: none;
        transition:
          background 0.15s,
          border-color 0.15s,
          transform 0.1s;
        -webkit-tap-highlight-color: transparent;
      }
      .record-btn:active {
        background: var(--accent-mid);
        border-color: var(--accent);
        transform: scale(0.98);
      }
      .record-btn .btn-icon {
        font-size: 1.25rem;
        flex-shrink: 0;
      }

      /* 데이터 없음 */
      .empty-state {
        text-align: center;
        padding: 60px 24px;
        color: var(--text-sub);
      }
      .empty-state .empty-icon {
        font-size: 3rem;
        margin-bottom: 12px;
      }
      .empty-state .empty-text {
        font-size: 0.9375rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <script id="board-raw" type="application/json">
      <?!= boardJson ?>
    </script>
    <script id="updated-raw" type="text/plain">
      <?!= updatedAt ?>
    </script>
    <script id="base-url-raw" type="text/plain">
      <?!= baseUrl ?>
    </script>
    <script id="notices-raw" type="application/json">
      <?!= noticesJson ?>
    </script>

    <div class="header">
      <div class="header-top">
        <span class="header-badge">🅿️ 주차 현황</span>
        <span class="header-updated" id="updatedAt"></span>
      </div>
      <div class="header-title">차량 위치 보드</div>
      <div class="header-subtitle">현재 주차된 차량 위치를 확인하세요</div>
    </div>

    <div class="grid" id="carGrid"></div>

    <div class="notice-overlay" id="noticeOverlay"></div>
    <div
      class="notice-sheet"
      id="noticeSheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="noticeSheetTitle"
    >
      <div class="notice-sheet-handle"></div>
      <div class="notice-sheet-header">
        <span class="notice-sheet-title" id="noticeSheetTitle">📢 공지사항</span>
        <button
          type="button"
          class="notice-sheet-close"
          id="noticeSheetClose"
          aria-label="공지 닫기"
        >
          ×
        </button>
      </div>
      <div class="notice-sheet-list" id="noticeSheetList"></div>
      <div class="notice-sheet-footer">
        <button
          type="button"
          class="notice-sheet-confirm"
          id="noticeSheetConfirm"
        >
          확인
        </button>
      </div>
    </div>

    <script>
      const board = JSON.parse(
        document.getElementById("board-raw").textContent,
      );
      const updatedAt = document
        .getElementById("updated-raw")
        .textContent.trim();
      const baseUrl = document
        .getElementById("base-url-raw")
        .textContent.trim();

      document.getElementById("updatedAt").textContent = updatedAt
        ? "기준: " + updatedAt
        : "";

      (function renderNotices() {
        const sheet = document.getElementById("noticeSheet");
        const overlay = document.getElementById("noticeOverlay");
        const list = document.getElementById("noticeSheetList");
        if (!sheet || !overlay || !list) return;

        let notices = [];
        try {
          notices = JSON.parse(
            document.getElementById("notices-raw").textContent,
          );
        } catch (_) {}
        if (!Array.isArray(notices) || notices.length === 0) return;

        const pending = notices.filter((n) => {
          if (!n || !n.id) return false;
          try {
            return !localStorage.getItem("ppap_notice_dismissed_" + n.id);
          } catch (_) {
            return true;
          }
        });
        if (pending.length === 0) return;

        list.innerHTML = "";
        pending.forEach((n) => {
          const item = document.createElement("div");
          item.className = "notice-item";
          if (n.title) {
            const t = document.createElement("div");
            t.className = "notice-item-title";
            t.textContent = n.title;
            item.appendChild(t);
          }
          if (n.body) {
            const b = document.createElement("div");
            b.className = "notice-item-body";
            b.textContent = n.body;
            item.appendChild(b);
          }
          list.appendChild(item);
        });

        function dismiss() {
          pending.forEach((n) => {
            try {
              localStorage.setItem("ppap_notice_dismissed_" + n.id, "1");
            } catch (_) {}
          });
          sheet.classList.remove("show");
          overlay.classList.remove("show");
        }

        document.getElementById("noticeSheetClose").onclick = dismiss;
        document.getElementById("noticeSheetConfirm").onclick = dismiss;
        overlay.onclick = dismiss;

        requestAnimationFrame(() => {
          sheet.classList.add("show");
          overlay.classList.add("show");
        });
      })();

      const grid = document.getElementById("carGrid");

      if (!board || board.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1">
            <div class="empty-icon">🚗</div>
            <div class="empty-text">등록된 차량 데이터가 없습니다.</div>
          </div>`;
      } else {
        const makeEl = (tag, className, text) => {
          const el = document.createElement(tag);
          if (className) el.className = className;
          if (text != null) el.textContent = text;
          return el;
        };

        board.forEach((car) => {
          const hasParking = car.parking && car.parking.trim() !== "";

          // 운행일지 폼 URL: 베이스 URL에 차량번호 파라미터 추가
          const formUrl =
            (baseUrl || "") + "?car=" + encodeURIComponent(car.carNo);

          const card = makeEl("div", "car-card");

          // 차량번호
          const carNumber = makeEl("div", "car-number");
          const carIcon = makeEl("span", "car-icon", "🚗");
          carNumber.appendChild(carIcon);
          carNumber.appendChild(
            document.createTextNode(
              car.carName ? car.carName + " · " + car.carNo : car.carNo,
            ),
          );
          card.appendChild(carNumber);

          // 주차위치
          const slot = makeEl(
            "div",
            "parking-slot" + (hasParking ? "" : " unknown"),
          );
          slot.appendChild(makeEl("div", "slot-label", "주차 위치"));
          slot.appendChild(
            makeEl("div", "slot-value", hasParking ? car.parking : "미기록"),
          );
          card.appendChild(slot);

          // 운전자/시간
          const meta = makeEl("div", "meta-row");
          const driverItem = makeEl("div", "meta-item");
          driverItem.appendChild(makeEl("span", "meta-icon", "👤"));
          driverItem.appendChild(
            makeEl("span", "meta-value", car.name || "—"),
          );
          meta.appendChild(driverItem);

          const timeItem = makeEl("div", "meta-item");
          timeItem.appendChild(makeEl("span", "meta-icon", "🕐"));
          timeItem.appendChild(makeEl("span", "meta-value", car.time || "—"));
          meta.appendChild(timeItem);
          card.appendChild(meta);

          // 기록 버튼
          const btn = makeEl("a", "record-btn");
          btn.href = formUrl;
          btn.appendChild(makeEl("span", "btn-icon", "📋"));
          btn.appendChild(document.createTextNode("운행일지 기록하기"));
          card.appendChild(btn);

          grid.appendChild(card);
        });
      }
    </script>
  </body>
</html>
